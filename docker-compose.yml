services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: nexfleet-postgres
    environment:
      POSTGRES_USER: nexfleet
      POSTGRES_PASSWORD: nexfleet
      POSTGRES_DB: nexfleet
    ports:
      - '5432:5432'
    volumes:
      - nexfleet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexfleet']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexfleet-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexfleet_pg:
